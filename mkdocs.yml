# The documentation site published at https://rbx-forge.github.io/rbx-apikey/
# by .github/workflows/docs.yml. `docs_dir` is `docs/` in place: the site and
# the repository serve the same files.

site_name: rbx-apikey
site_description: Declare Roblox Open Cloud API keys in a file, and keep Roblox in step with it.
site_url: https://rbx-forge.github.io/rbx-apikey/
repo_url: https://github.com/rbx-forge/rbx-apikey
repo_name: rbx-forge/rbx-apikey
edit_uri: edit/main/docs/
copyright: MPL-2.0

docs_dir: docs
site_dir: site

# A missing nav file, a broken link or a link to a heading that does not exist
# fails the build.
strict: true
validation:
  anchors: warn

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow the system

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rbx-forge/rbx-apikey
      name: rbx-apikey on GitHub

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Configuration: configuration.md
  - Commands: commands.md
  - doctor: doctor.md
  - Reference:
      - Authentication: reference/authentication.md
      - Secret storage: reference/secrets.md
      - JSON output: reference/json.md